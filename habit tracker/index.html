<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <title>Habit Tracker</title>
    <script src="script.js" defer></script>
    <link rel="icon" type="image/x-icon" href="../img/pika.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Edu+NSW+ACT+Cursive:wght@400..700&family=Indie+Flower&display=swap" rel="stylesheet">
</head>
<body>
    <h1 id="title">Month</h1>
    <h4 id="subtitle">Monthly Habit Tracker</h4>

    <div id="calendarContainer">
        <div id="calendarDiv">
            <div id="calendarHeading">
                <p id="habitTitle">My new Habit</p>
                <p id="totalDays">0/31</p>
            </div>

            <div id="calendarContent">
                <div class="days">
                    <div class="day">1</div>
                    <div class="day">1</div>
                    <div class="day">1</div>
                    <div class="day">1</div>
                    <div class="day">1</div>
                    <div class="day">1</div>
                    <div class="day">1</div>
                </div>

                <div class="days">
                    <div class="day">1</div>
                    <div class="day">1</div>
                    <div class="day">1</div>
                    <div class="day">1</div>
                    <div class="day">1</div>
                    <div class="day">1</div>
                    <div class="day">1</div>
                </div>

                <div class="days">
                    <div class="day">1</div>
                    <div class="day">1</div>
                    <div class="day">1</div>
                    <div class="day">1</div>
                    <div class="day">1</div>
                    <div class="day">1</div>
                    <div class="day">1</div>
                </div>

                <div class="days">
                    <div class="day">1</div>
                    <div class="day">1</div>
                    <div class="day">1</div>
                    <div class="day">1</div>
                    <div class="day">1</div>
                    <div class="day">1</div>
                    <div class="day">1</div>
                </div>

                <div class="days">
                    <div class="day">1</div>
                    <div class="day">1</div>
                    <div class="day">1</div>
                    <div class="day">1</div>
                    <div class="day">1</div>
                    <div class="day">1</div>
                    <div class="day">1</div>
                </div>
            </div>
        </div>
    </div>

    <button class="reset">Reset</button>
</body>
</html>

<style>
      body {
        font-family: "Edu NSW ACT Cursive", cursive;
        font-weight: 400;
        background: linear-gradient(to bottom right, #fbf581 0%, #fef99c 25%, #faf6ab 50%, #fef99c 75%, #fbf581 100%);
        margin:0%;
        padding:0%;
        text-align:center;
      }

      #title{
        margin-top: 100px;
        line-height: 10px;
      }

      #subtitle{
        opacity: 0.7;
        font-size: 18px;
      }

      #calendarContainer{
        display:flex;
        justify-content: center;
      }

      .days{
        display:flex;
      }

      #calendarDiv{
        background-color: #fff;
        border-radius: 10px 10px 20px 20px;
        margin:auto;
        align-content: center;
        text-align: center;
        width: 85%;
        max-width: 1000px;
      }

      #calendarHeading{
        display:flex;
        justify-content: space-between;
        border-radius: 10px 10px 0px 0px;
        border: 2px solid black;
        padding-left: 20px;
        padding-right: 20px;
        font-size: 20px;
        background-color: #fdfac8;
        line-height: 0px;
      }

      #calendarContent{
        padding: 20px;
        border: 2px solid black;
      }
      
      .day{
        width: 30px;
        margin: 5px;
        padding: 10px;
        font-size: 15px;
        text-align: center;
        border-radius: 20px;
      }

      .day:hover{
        background-color: #fffddc;
        box-shadow:3px 3px black;
      }


      /* Tablets */
      @media (min-width: 600px) {
        #calendarDiv{
          width: 90%;
        }

        #calendarContent{
          padding: 25px;
        }

        .day{
          width: 45px;
          margin: 6px;
          padding: 12px;
          font-size: 16px;
        }
      }


      /* Laptops */
      @media (min-width: 1024px) {
        #title{
          margin-top: 70px;
        }

        #calendarDiv{
          width: 80%;
          max-width: 1000px;
        }

        #calendarHeading{
          padding-left: 30px;
          padding-right: 30px;
          font-size: 22px;
        }

        #calendarContent{
          padding: 30px;
        }

        .days{
          justify-content: center;
          gap: 8px;
        }

        .day{
          width: 70px;
          margin: 0px;
          padding: 15px 10px;
          font-size: 17px;
        }
      }


      /* Large screens */
      @media (min-width: 1400px) {
        #calendarDiv{
          max-width: 1100px;
        }

        #calendarContent{
          padding: 35px;
        }

        .day{
          width: 75px;
          padding: 18px 12px;
          font-size: 18px;
        }
      }

</style>
